<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar senha | Espaço de Leitura Digital</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon/favicon.svg?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-shell">
        <section class="content-card auth-card">
            <span class="page-eyebrow">Segurança da conta</span>
            <h1 class="h3 mb-2">Alterar senha</h1>
            <p class="text-secondary">Primeiro informe a senha que acabou de usar para entrar. Depois escolha uma nova senha com pelo menos 8 caracteres.</p>
            <form id="formAlterarSenha">
                <label for="contaAlterarSenha" class="form-label">Conta conectada</label>
                <input id="contaAlterarSenha" name="username" class="form-control mb-3" type="email" autocomplete="username" readonly>
                <label for="senhaAtual" class="form-label">1. Senha usada para entrar (temporária ou atual)</label>
                <input id="senhaAtual" name="current-password" class="form-control mb-3" type="password" autocomplete="current-password" maxlength="128" required>
                <label for="novaSenha" class="form-label">2. Nova senha</label>
                <input id="novaSenha" class="form-control mb-3" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                <label for="confirmarSenha" class="form-label">3. Confirme a nova senha</label>
                <input id="confirmarSenha" class="form-control mb-3" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                <div class="form-check mb-3"><input id="mostrarSenhas" class="form-check-input" type="checkbox"><label for="mostrarSenhas" class="form-check-label">Mostrar senhas para conferir</label></div>
                <p id="erroAlterarSenha" class="text-danger" role="alert" tabindex="-1"></p>
                <button id="salvarNovaSenha" disabled class="btn btn-primary-custom w-100" type="submit">Salvar nova senha</button>
            </form>
            <button id="trocarContaSenha" class="btn btn-secondary-custom w-100 mt-3" type="button">Sair e entrar novamente</button>
        </section>
    </main>
    <script src="js/alterarSenha.js"></script>
    <script src="js/auth-ui.js"></script>
</body>
</html>
