<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro de leitor | Espaço de Leitura Digital</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><main class="container py-5"><a href="biblioteca.html">← Voltar à Biblioteca</a>
<section class="content-card mt-4"><h1 class="fs-3">Cadastre-se como leitor</h1>
<p>Escolha o centro em que fará suas retiradas. Você poderá reservar e retirar livros somente desse centro.</p>
<form id="formCadastro" class="row g-3">
<div class="col-md-6"><label for="nome" class="form-label">Nome completo</label><input id="nome" name="nome" class="form-control" maxlength="200" autocomplete="name" required></div>
<div class="col-md-6"><label for="email" class="form-label">Email de acesso</label><input id="email" name="email" type="email" class="form-control" maxlength="254" autocomplete="email" required></div>
<div class="col-md-6"><label for="nascimento" class="form-label">Data de nascimento</label><input id="nascimento" name="dataNascimento" type="date" class="form-control" required></div>
<div class="col-md-6"><label for="centro" class="form-label">Centro de retirada</label><select id="centro" name="centroId" class="form-select" required><option value="">Selecione</option></select></div>
<div class="col-md-6"><label for="tipo" class="form-label">Tipo de leitor</label><select id="tipo" name="tipo" class="form-select"><option>Comunidade</option><option>Aluno</option><option>Professor</option><option>Funcionário</option><option>Voluntário</option></select></div>
<div class="col-md-6"><label for="telefone" class="form-label">Telefone (opcional)</label><input id="telefone" name="telefone" type="tel" maxlength="30" class="form-control" autocomplete="tel"></div>
<div class="col-md-6"><label for="senha" class="form-label">Senha (8 a 128 caracteres)</label><input id="senha" name="senha" type="password" minlength="8" maxlength="128" class="form-control" autocomplete="new-password" required></div>
<div class="col-md-6"><label for="confirmacao" class="form-label">Confirme a senha</label><input id="confirmacao" name="confirmacao" type="password" minlength="8" maxlength="128" class="form-control" autocomplete="new-password" required></div>
<div class="col-12"><button id="cadastrar" class="btn btn-primary-custom" disabled>Criar cadastro</button> <a href="login.html">Já tenho cadastro</a><p id="avisoCadastro" role="status" class="mt-3">Carregando centros…</p></div>
</form></section></main><script src="js/sessao.js"></script><script type="module" src="js/cadastro.js"></script></body></html>
