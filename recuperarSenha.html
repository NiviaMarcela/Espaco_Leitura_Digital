<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acesso | Espaço de Leitura Digital</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon/favicon.svg?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-shell">
        <section class="content-card auth-card">
            <nav class="login-nav" aria-label="Navegação da conta">
                <a class="login-brand" href="/" aria-label="Espaço de Leitura Digital - início">
                    <img src="assets/img/AF_InstitutoJanela_Logo_RGB_VER_NEG1.jpg" alt="">
                    <span>Espaço de <strong>Leitura Digital</strong></span>
                </a>
            </nav>
            <h1 class="h3 mb-2">Recuperar acesso</h1>
            <p>A recuperação é feita com ajuda do administrador. Informe o e-mail da sua conta e procure a equipe do seu Centro para confirmar sua identidade.</p>
            <p class="small text-secondary">Não enviamos e-mail automático. Nunca informe sua senha antiga à equipe.</p>
            <form id="formRecuperacao">
                <label class="form-label" for="emailRecuperacao">E-mail cadastrado</label>
                <input class="form-control mb-3" id="emailRecuperacao" type="email" maxlength="254" autocomplete="username" required>
                <button id="solicitarRecuperacao" class="btn btn-primary-custom w-100" type="submit">Solicitar ajuda para recuperar acesso</button>
            </form>
            <p id="avisoRecuperacao" role="status" aria-live="polite" class="mt-3" tabindex="-1"></p>
            <a class="btn login-home-action w-100 mt-3" href="/login.html">Voltar ao login</a>
        </section>
    </main>
    <script src="js/recuperarSenha.js"></script>
</body></html>
