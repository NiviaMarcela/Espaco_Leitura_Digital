<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Espaço de Leitura Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-shell">
        <section class="content-card auth-card">
            <nav class="login-nav" aria-label="Navegação da conta">
                <a class="login-brand" href="/" aria-label="Espaço de Leitura Digital - início">
                    <img src="assets/img/AF_InstitutoJanela_Logo_RGB_VER_NEG1.jpg" alt="">
                    <span>Espaço de <strong>Leitura Digital</strong></span>
                </a>
            </nav>
            <h1 class="h3 mb-2">Entrar</h1>
            <p class="text-secondary">Use o e-mail cadastrado e a senha que você criou no cadastro ou recebeu do administrador.</p>
            <form id="formLogin">
                <label for="emailLogin" class="form-label">E-mail</label>
                <input id="emailLogin" class="form-control mb-3" type="email" autocomplete="username" maxlength="254" required>
                <label for="senhaLogin" class="form-label">Senha</label>
                <input id="senhaLogin" class="form-control mb-3" type="password" autocomplete="current-password" maxlength="128" required>
                <p id="erroLogin" class="text-danger" role="alert" tabindex="-1"></p>
                <button id="entrarLogin" class="btn btn-primary-custom w-100" type="submit">Entrar</button>
            </form>
                <p class="text-secondary text-center mt-4 mb-2">Ainda não tem cadastro?</p>
                <a class="btn login-register-action w-100" href="/?cadastro=1">Cadastre-se como leitor</a>
                <a class="btn login-home-action w-100 mt-3" href="/">Voltar à Tela Inicial</a>
        </section>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
